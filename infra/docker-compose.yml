services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: labourx
      POSTGRES_PASSWORD: labourx
      POSTGRES_DB: labourx
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U labourx -d labourx"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
