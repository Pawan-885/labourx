services:

  # postgres:
  #   image: postgis/postgis:17-3.5
  #   container_name: labourx-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: labourx
  #     POSTGRES_PASSWORD: labourx_dev_password
  #     POSTGRES_DB: labourx
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - labourx_postgres_data:/var/lib/postgresql/data
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: labourx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labourx
      POSTGRES_PASSWORD: labourx_dev_password
      POSTGRES_DB: labourx
    ports:
      - "5432:5432"
    volumes:
      - labourx_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    container_name: labourx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - labourx_redis_data:/data

volumes:
  labourx_postgres_data:
  labourx_redis_data: